<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Login - Disaster Dashboard</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #2c2c3f;
      margin: 0;
    }
    .container {
      text-align: center;
      padding: 40px;
      background: rgba(255,255,255,0.05);
      border-radius: 20px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      width: 400px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    h1 {
      font-size: 1.8rem;
      font-weight: 900;
      margin-bottom: 10px;
    }
    p.description {
      font-size: 1rem;
      color: #ccc;
      margin-bottom: 25px;
    }
    .emergency {
      margin-top: 20px;
      color: #ff5555;
      font-weight: bold;
    }
    input, button {
      width: 100%;
      margin-bottom: 15px;
      padding: 12px;
      border-radius: 10px;
      border: none;
      font-size: 1rem;
    }
    button {
      background: #dc3545;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #c82333; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Admin Dashboard Access</h1>
    <p class="description">Secure login for administrators. Manage users and monitor disaster reports in real-time.</p>

    {% if error %}
      <p style="color:red;">{{ error }}</p>
    {% endif %}
    <form method="POST">
      <input type="text" name="username" placeholder="Admin Username" required autofocus />
      <input type="password" name="password" placeholder="Password" required />
      <button type="submit">Login as Admin</button>
    </form>

    <p class="emergency">Emergency Numbers: Fire - 101 | Police - 100 | Ambulance - 108</p>
  </div>
</body>
</html>
